<title>덱 제목</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #e9ece8; --stage: #f7f8f5; --ink: #18211d; --muted: #56625c; --rule: #cfd6d0;
    --accent: #0c6b52; --accent-soft: #d5e8df; --warn: #a3470f; --warn-soft: #f4e1d3;
    --slide-dark: #15201b; --slide-dark-ink: #e8efe9; --letterbox: #000;
    --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #101512; --stage: #1a221e; --ink: #e3ebe5; --muted: #9aa9a1; --rule: #2e3a34;
      --accent: #5cc8a4; --accent-soft: #1f3a30; --warn: #f0a070; --warn-soft: #3a261a;
      --slide-dark: #0b100d; --slide-dark-ink: #e3ebe5; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #101512; --stage: #1a221e; --ink: #e3ebe5; --muted: #9aa9a1; --rule: #2e3a34;
    --accent: #5cc8a4; --accent-soft: #1f3a30; --warn: #f0a070; --warn-soft: #3a261a;
    --slide-dark: #0b100d; --slide-dark-ink: #e3ebe5; color-scheme: dark;
  }

  /* 셸은 화면 높이에 맞춘다. 페이지는 스크롤되지 않고, 남는 공간에 맞춰 메인 슬라이드가 줄어든다 */
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); padding: 12px 16px; box-sizing: border-box; overflow: hidden;
    height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
  .shell { height: 100%; max-width: 1440px; margin: 0 auto; display: grid; gap: 12px;
    grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar" "main" "strip"; }
  .shell[data-mode="presenter"] { grid-template-columns: minmax(0, 1fr) minmax(260px, 360px); grid-template-areas: "bar bar" "main panel" "strip strip"; }
  .shell[data-mode="audience"] { grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "bar" "main"; }
  @media (min-width: 900px) {
    .shell[data-strip="vertical"]:not([data-mode="audience"]) { grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "bar bar" "strip main"; }
    .shell[data-strip="vertical"][data-mode="presenter"] { grid-template-columns: 200px minmax(0, 1fr) minmax(260px, 360px);
      grid-template-areas: "bar bar bar" "strip main panel"; }
  }
  @media (max-width: 899px) {
    .shell[data-mode="presenter"] { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr) auto;
      grid-template-areas: "bar" "main" "panel" "strip"; }
    .tools [data-strip] { display: none; }
  }

  .bar { grid-area: bar; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  .bar h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .bar .section { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .bar-controls { display: flex; flex-wrap: wrap; gap: 8px 16px; }

  .modes { display: flex; gap: 4px; flex-wrap: wrap; }
  .modes button { font: 500 13px var(--sans); color: var(--muted); background: transparent; border: 1px solid var(--rule);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .modes button[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); background: var(--accent-soft); }
  .modes button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .main { grid-area: main; display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: 10px; min-width: 0; min-height: 0; }
  .stage { container-type: size; display: grid; place-items: end center; min-height: 0; }

  /* 1920×1080 캔버스를 JS가 박스에 맞춰 축소한다. 메인 뷰포트는 무대 칸의 폭과 높이 중 좁은 쪽에 맞춘다 */
  .viewport { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
    border: 1px solid var(--rule); border-radius: 6px; background: var(--stage); box-sizing: border-box; }
  .stage .viewport { width: min(100cqw, 100cqh * 16 / 9); }
  .stage .viewport.filled { position: fixed; inset: 0; z-index: 10; width: auto; aspect-ratio: auto; border: 0; border-radius: 0; background: var(--letterbox);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .viewport:fullscreen { background: var(--letterbox); border: 0; border-radius: 0; }
  .canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .preview .canvas { pointer-events: none; }
  .corner { position: absolute; right: 10px; bottom: 10px; z-index: 2; font: 500 12px var(--sans); color: var(--ink);
    background: var(--stage); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; cursor: pointer; opacity: .85; }
  .corner:hover, .corner:focus-visible { opacity: 1; outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { grid-area: panel; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; }
  .panel h2 { margin: 0; font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .panel .block { display: grid; gap: 8px; }
  .panel .block.grow { flex: 1; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 200px; }
  .notes { box-sizing: border-box; width: 100%; height: 100%; min-height: 120px; margin: 0; padding: 12px 14px; resize: none;
    font: 16px/1.6 var(--sans); color: var(--ink); background: var(--stage); border: 1px solid var(--rule); border-radius: 6px; }
  .notes:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  /* 노트 편집기(notes-editor.js): 쓰는 자리에서 마크다운이 서식으로 바뀐다 */
  .notes-rich { overflow-y: auto; cursor: text; }
  .notes-rich:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .notes .notes-doc { min-height: 100%; outline: none; overflow-wrap: anywhere; }
  .notes .notes-doc > * { margin: 0 0 .6em; }
  .notes .notes-doc > :last-child { margin-bottom: 0; }
  .notes .notes-doc :is(h1, h2, h3, h4) { margin: .9em 0 .4em; font-family: var(--sans); font-weight: 700; line-height: 1.3;
    letter-spacing: 0; text-transform: none; color: var(--ink); }
  .notes .notes-doc > :is(h1, h2, h3, h4):first-child { margin-top: 0; }
  .notes .notes-doc h1 { font-size: 22px; }
  .notes .notes-doc h2 { font-size: 19px; }
  .notes .notes-doc :is(h3, h4) { font-size: 17px; }
  .notes .notes-doc :is(ul, ol) { padding-left: 1.4em; }
  .notes .notes-doc li > p { margin: 0; }
  .notes .notes-doc code { font: 14px var(--mono); background: var(--accent-soft); border-radius: 4px; padding: 1px 5px; }
  .notes .notes-doc pre { font: 14px/1.5 var(--mono); background: var(--ground); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
  .notes .notes-doc pre code { background: none; padding: 0; }
  .notes .notes-doc blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--muted); }
  .notes .notes-doc hr { border: 0; border-top: 1px solid var(--rule); }
  .notes .notes-doc a { color: var(--accent); }
  .notes .notes-doc p.is-editor-empty:first-child::before { content: attr(data-placeholder); float: left; height: 0; color: var(--muted); pointer-events: none; }
  .notes-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .notes-status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .notes-status[data-state="dirty"] { color: var(--warn); }
  .status { margin: 0; font-family: var(--mono); font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rule); flex: none; }
  .status[data-state="live"]::before { background: var(--accent); }
  .status[data-state="error"]::before { background: var(--warn); }
  .audience-link { font-size: 14px; line-height: 1.5; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
  .audience-link a { color: var(--accent); }

  .slide { word-break: keep-all; position: absolute; inset: 0; padding: 128px; display: flex; flex-direction: column; gap: 48px;
    background: var(--stage); color: var(--ink); }
  .slide.dark { background: var(--slide-dark); color: var(--slide-dark-ink); }
  .slide h2 { margin: 0; font-size: 72px; line-height: 1.1; font-weight: 700; letter-spacing: -1px; text-wrap: balance; }
  .slide p { margin: 0; font-size: 34px; line-height: 1.45; color: var(--muted); max-width: 1400px; }
  .slide.dark p { color: color-mix(in srgb, var(--slide-dark-ink) 70%, transparent); }
  .eyebrow { font-family: var(--mono); font-size: 28px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
  .footer { position: absolute; left: 128px; right: 128px; bottom: 64px; display: flex; justify-content: space-between;
    font-family: var(--mono); font-size: 24px; color: var(--muted); }

  .cover { justify-content: flex-end; }
  .cover h2 { font-size: 132px; }

  .nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .nav button { font: 500 14px var(--sans); color: var(--ink); background: var(--stage); border: 1px solid var(--rule);
    border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  .nav button:hover:not(:disabled) { border-color: var(--accent); }
  .nav button:disabled { opacity: .45; cursor: default; }
  .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav .count { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }

  /* 슬라이드 목록: 가로(하단 한 줄), 세로(왼쪽 한 열), 펼치기(셸 아래 전체를 덮는 바둑판) */
  .strip { grid-area: strip; position: relative; display: flex; gap: 10px; overflow: auto; padding: 4px 4px 8px; min-height: 0;
    scroll-snap-type: x proximity; }
  .strip button { flex: none; width: 176px; display: grid; gap: 6px; align-content: start; padding: 6px; font: 13px var(--sans); color: var(--muted);
    text-align: left; background: transparent; border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; scroll-snap-align: start; }
  .strip button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strip button .viewport { border-radius: 4px; }
  .strip button:hover { border-color: var(--accent); }
  .strip button[aria-current="true"] { color: var(--ink); border-color: var(--accent); background: var(--accent-soft); }
  .strip button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (min-width: 900px) {
    .shell[data-strip="vertical"] .strip { flex-direction: column; scroll-snap-type: y proximity; }
    .shell[data-strip="vertical"] .strip button { width: auto; }
    .shell[data-strip="vertical"] .stage { place-items: center; }
  }
  .shell[data-grid] .strip { grid-row: 2 / -1; grid-column: 1 / -1; z-index: 5; display: grid; align-content: start; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); background: var(--ground); scroll-snap-type: none; }
  .shell[data-grid] .strip button { width: auto; }

</style>

<div class="shell" id="layout">
  <header class="bar">
    <h1 id="deckTitle"></h1>
    <div class="bar-controls">
      <div class="modes tools" id="stripTools" role="group" aria-label="슬라이드 목록">
        <button type="button" data-strip="horizontal">가로 목록</button>
        <button type="button" data-strip="vertical">세로 목록</button>
        <button type="button" id="gridButton" aria-controls="strip" aria-expanded="false">전체 펼치기</button>
        <button type="button" id="gridPinButton" aria-controls="strip" aria-pressed="false">펼친 채 고정</button>
      </div>
      <div class="modes" id="modes" role="group" aria-label="보기 모드">
        <button type="button" data-mode="solo">혼자 보기</button>
        <button type="button" data-mode="presenter" id="presenterModeButton">발표자</button>
        <button type="button" data-mode="audience">청중</button>
      </div>
    </div>
  </header>
  <div class="main">
    <div class="stage">
      <div class="viewport" id="viewport">
        <div class="canvas" id="canvas"></div>
        <button class="corner" id="fullscreenButton" type="button">전체화면</button>
      </div>
    </div>
    <div class="nav" id="nav">
      <button id="prevButton" type="button">← 이전</button>
      <button id="nextButton" type="button">다음 →</button>
      <span class="count" id="counter"></span>
    </div>
    <p class="status" id="syncStatus" data-state="idle"></p>
  </div>
  <aside class="panel" id="presenterPanel" hidden>
    <div class="block grow">
      <h2><label for="notesInput">발표 노트 · 나만 보기 · 자동 저장</label></h2>
      <textarea class="notes" id="notesInput" spellcheck="false"></textarea>
      <div class="notes-bar">
        <span class="notes-status" id="notesStatus" data-state="idle"></span>
      </div>
    </div>
    <div class="block">
      <h2>청중 창</h2>
      <p class="audience-link" id="audienceLink"></p>
    </div>
  </aside>
  <nav class="strip" id="strip" aria-label="슬라이드 목록"></nav>
</div>

<!--
  슬라이드는 여기 <slide> 태그로 쓴다. 순서가 곧 슬라이드 순서다. 틀(deck.js)이 읽어서 보여 준다.
  <template id="slides" data-title data-url>
    data-title  덱 제목. 상단 제목과 슬라이드 푸터에 쓴다. 비우면 <title>을 쓴다
    data-url    이 덱을 퍼블리시한 아티팩트 주소 (claude.ai/artifact/…). 발표자 패널의 "청중 창 새로 열기"가
                이 주소에 #audience를 붙여 연다. 페이지는 격리된 프레임에서 돌아 자기 공유 주소를 알 수 없으므로
                퍼블리시 후 받은 주소를 여기 적는다. 비우면 링크 대신 "링크를 직접 열라"는 안내가 나온다
  <slide id label [section] [class] [footer]>
    id       슬라이드 고유 이름 (#id 링크로 바로 열린다)
    label    슬라이드 목록에 보이는 이름
    section  이 슬라이드에서 시작하는 섹션 이름
    class    슬라이드 바탕에 붙일 클래스 (dark, cover 등)
    footer   붙이면 하단에 덱 제목과 쪽 번호를 단다
  <notes>는 발표 노트 기본값(마크다운. 태그에 맞춘 들여쓰기는 틀이 걷어낸다), <script type="text/slide">는 슬라이드별 스크립트다.
  스크립트는 슬라이드가 화면에 붙을 때마다 실행되고 `slide`를 받는다 (deck.js 머리말 참고).
    <script type="text/slide">
      const button = slide.root.querySelector('[data-action="add"]');
      button.addEventListener("click", () => slide.set({ count: (slide.values.count ?? 0) + 1 }));
      slide.onUpdate((values) => { button.textContent = `누른 횟수 ${values.count ?? 0}`; });
    </script>
    - 요소는 id 대신 data-* 로 찾는다 (슬라이드 목록 미리보기에서는 id가 지워진다)
    - slide.set()으로 바꾼 값은 발표자·청중 창에 동기화된다. 키 이름은 덱 전체에서 겹치지 않게 짓는다
  예제 덱: 이 스킬의 examples/deck-example.html
-->
<template id="slides" data-title="" data-url="">
  <slide id="cover" label="표지" section="첫 섹션" class="dark cover">
    <notes>표지에서 할 말.</notes>
    <span class="eyebrow">분류 · 행사</span>
    <h2>덱 제목</h2>
    <p>한 문장 부제.</p>
  </slide>

  <slide id="point" label="본문" footer>
    <notes>이 슬라이드에서 할 말.</notes>
    <span class="eyebrow">소제목</span>
    <h2>슬라이드 제목</h2>
    <p>본문 한두 문장.</p>
  </slide>

  <slide id="close" label="마무리" class="dark">
    <notes>질문을 받습니다.</notes>
    <span class="eyebrow">마무리</span>
    <h2>마무리 한 줄</h2>
  </slide>
</template>

<script src="https://cdn.jsdelivr.net/npm/@s-dante/artifact-deck@0.3.0/deck.js"></script>
